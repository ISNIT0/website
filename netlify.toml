[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # No inline scripts: the gtag config lives in /assets/analytics.js so that
    # script-src can stay at 'self' plus the two analytics origins.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://scripts.simpleanalyticscdn.com; style-src 'self'; font-src 'self'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://queue.simpleanalyticscdn.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://queue.simpleanalyticscdn.com https://api.simpleanalyticscdn.com; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests"

# Font filenames are stable and their contents never change, so they are safe
# to pin. Everything else relies on Netlify's default ETag revalidation,
# because main.css is not content-hashed.
[[headers]]
  for = "/fonts/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
